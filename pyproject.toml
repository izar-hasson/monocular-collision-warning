[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monocular-collision-warning"
version = "0.1.0.dev0"
description = "Offline monocular RGB collision-warning research prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]

[project.scripts]
collision-warning = "collision_warning.cli:main"

[project.optional-dependencies]
video = [
    "av>=19.0.1",
    "numpy>=2.5,<3",
]
gpu = [
    "av==19.0.1",
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "ultralytics==8.4.172",
    "torch==2.14.1+cu130; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.29.1+cu130; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.23"
# Keep the inference closure on the working baseline, including CUDA support
# libraries and Polars, rather than migrating transitive packages during acceptance.
constraint-dependencies = [
    "cuda-bindings==13.3.1",
    "cuda-pathfinder==1.6.0",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "MarkupSafe==3.0.3",
    "networkx==3.6.1",
    "nvidia-nvjitlink==13.3.33",
    "polars==1.44.2",
    "polars-runtime-32==1.44.2",
    "ultralytics-platform==0.1.78",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -m 'not gpu and not slow and not benchmark'"
markers = [
    "gpu: opt-in tests requiring CUDA and pinned model assets",
    "integration: lightweight CPU tests spanning component boundaries",
    "slow: opt-in recorded-video or other long-running tests",
    "benchmark: opt-in measurements on declared hardware",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["build", "dist", "local-baselines"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/collision_warning", "scripts/test_detection.py"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["av", "torch", "ultralytics", "cv2"]
ignore_missing_imports = true
