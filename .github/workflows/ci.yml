name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cpu:
    name: CPU checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Install locked CPU developer environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check package types
        run: uv run --locked mypy
      - name: Run CPU tests
        run: uv run --locked pytest -q
      - name: Build distributions and verify installed wheel
        run: |
          uv build --out-dir dist
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c "from collision_warning.cli import main; assert callable(main)"
          "$RUNNER_TEMP/wheel-smoke/bin/collision-warning" --help
          "$RUNNER_TEMP/wheel-smoke/bin/collision-warning" --version
